<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>new html 5 input types</title>
</head>
<body>
    <h1>new html 5 input types demo</h1>
    <p>Lorem ipsum, dolor sit amet consectetur adipisicing elit. Eius iste libero eum reiciendis repellendus magni? Fugiat, dolorem qui ut dolor accusantium quidem laudantium dolore odio earum soluta quos? Quidem, labore.</p>
    <form method="post" action="http://www.deitel.com">
        <p><label>color:<input type="color" auto focus/>(hexadesimal code such as #ADD8E6)</label></p>
        <p><label>date:<input type="date"/>(yyyy-mm-dd)</label></p>
        <p><label>email:<input type="email" place holder="name@domain(name@domani.com)"></label></p>
        <p><label>number:<input type="number" min="0"max="7"step="(Enter a number b/n 0 & 7)"></label></p>  
        <p><label>range:0<input type="range" min="0"max="20"value></label></p>
        <p><label>search:<input type="search"placeholder="searchqu(enter your search query here.)" ></label></p>
        <p><label>url:<input type="url" place holder="http://www.doma(http://www.domain.com)"></label></p>
        <p>
            <input type="submit" value="submit"/>
            <input type="reset" value="clear"/>
        </p>
    </form>
</body>
</html>
